<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Download research files · Natural Gas Field Studies</title><link rel="stylesheet" href="../lab/assets/research.css"></head><body><main class="wrap"><p><a href="./">All ten books</a></p><h1>Download research files</h1><p id="name"></p><button type="button" id="get" hidden>Prepare ZIP download</button><p id="status" role="status"></p><a id="save" hidden>Save verified ZIP</a><script>
const archives={"Book_Three_Research_Files.zip":{"sha256":"99b786e086080cf5c83d0b2fe8bd77a13b88db808a3b32ff2188e88b0765b0e7","parts":["files/Book_Three_Research_Files.zip.part1","files/Book_Three_Research_Files.zip.part2","files/Book_Three_Research_Files.zip.part3","files/Book_Three_Research_Files.zip.part4"]},"The_Missing_Megawatt_Research.zip":{"sha256":"8dd41eb8049c2b256c88918507877c936b133a3f38e217764287abda0fc4c9b1","parts":["files/The_Missing_Megawatt_Research.zip.part1","files/The_Missing_Megawatt_Research.zip.part2","files/The_Missing_Megawatt_Research.zip.part3"]},"Before_the_Sales_Meter_Research.zip":{"sha256":"e2f13549609fe605ca78647656e7c28b92e7a6f027fa6b7d03948471da49014d","parts":["files/Before_the_Sales_Meter_Research.zip.part1","files/Before_the_Sales_Meter_Research.zip.part2","files/Before_the_Sales_Meter_Research.zip.part3","files/Before_the_Sales_Meter_Research.zip.part4","files/Before_the_Sales_Meter_Research.zip.part5"]},"When_the_Front_Month_Changes_Research.zip":{"sha256":"676d87c0323fa7a5ad16cc91c6dbe1e916184c8ccac34f128ac98d4a1aee4f96","parts":["files/When_the_Front_Month_Changes_Research.zip.part1","files/When_the_Front_Month_Changes_Research.zip.part2","files/When_the_Front_Month_Changes_Research.zip.part3"]}};
const file=new URLSearchParams(location.search).get('file');
const archive=Object.hasOwn(archives,file)?archives[file]:null;
const button=document.querySelector('#get'),statusBox=document.querySelector('#status');
if(archive){document.querySelector('#name').textContent=file;button.hidden=false;}else{statusBox.textContent='Select a research companion from the book index.';}
button.onclick=async()=>{button.disabled=true;try{
const buffers=[];for(const [i,path] of archive.parts.entries()){statusBox.textContent='Reading part '+(i+1)+' of '+archive.parts.length+'…';const response=await fetch(path);if(!response.ok)throw Error();buffers.push(await response.arrayBuffer());}
const blob=new Blob(buffers,{type:'application/zip'});const digest=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());const hex=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');if(hex!==archive.sha256)throw Error();
const save=document.querySelector('#save');save.href=URL.createObjectURL(blob);save.download=file;save.hidden=false;button.hidden=true;statusBox.textContent='Verified against the original research archive.';save.click();
}catch(error){statusBox.textContent='The download could not be verified. Please retry.';button.disabled=false;}};
</script></main></body></html>
