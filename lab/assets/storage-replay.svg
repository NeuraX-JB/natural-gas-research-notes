<title id="title">Historical weekly storage prediction error by calendar year</title>
<desc id="desc">Weather-adjusted model has lower mean absolute error than the five-year seasonal median in every evaluated calendar year from 2018 to November 2026. Overall mean absolute errors are 20.50 and 30.50 Bcf, respectively. 2026 is partial. This is a retrospective replay using current-vintage observations, not verified live results.</desc>
